<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Where in the World? — A Carmen Sandiego-style Case Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="titlecard" class="titlecard">
      <h1>ACME DETECTIVE AGENCY</h1>
      <p>A globe-trotting case game in the spirit of the 1985 classic.<br>
      Chase a trail of witnesses across the world, build a warrant, and<br>
      make the arrest before time runs out.</p>
      <button onclick="newGame()">Start your first case</button>
    </div>
    <div id="screen"></div>
  </div>

  <script src="data.js"></script>
  <script src="game.js"></script>
</body>
</html>
